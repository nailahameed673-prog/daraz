<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daraz Clone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#333}
header{background:#f85606;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:bold;cursor:pointer}
.search{flex:1;min-width:180px;display:flex}
.search input{flex:1;padding:10px;border:none;border-radius:4px 0 0 4px;outline:none}
.search button{padding:10px 16px;border:none;background:#ffd2bd;color:#f85606;border-radius:0 4px 4px 0;cursor:pointer;font-weight:bold}
.nav button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;margin-left:10px}
.banner{background:linear-gradient(90deg,#f85606,#ffa000);color:#fff;padding:30px 20px;text-align:center;font-size:22px;font-weight:bold}
.cats{display:flex;gap:10px;padding:15px 20px;overflow-x:auto}
.cats button{padding:8px 16px;border:1px solid #f85606;background:#fff;color:#f85606;border-radius:20px;cursor:pointer;white-space:nowrap}
.cats button.active{background:#f85606;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px;padding:10px 20px 30px}
.card{background:#fff;border-radius:6px;padding:12px;box-shadow:0 1px 4px #0002;text-align:center}
.card .emoji{font-size:60px;margin:10px 0}
.card h4{font-size:14px;height:36px;overflow:hidden}
.price{color:#f85606;font-size:18px;font-weight:bold;margin:6px 0}
.old{color:#999;text-decoration:line-through;font-size:12px}
.card button{width:100%;padding:8px;background:#f85606;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-top:6px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;justify-content:center;align-items:center}
.modal.show{display:flex}
.box{background:#fff;padding:25px;border-radius:8px;width:92%;max-width:400px;max-height:90vh;overflow:auto}
.box h2{margin-bottom:15px;color:#f85606}
.box input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:4px}
.box .btn{width:100%;padding:10px;background:#f85606;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-top:8px;font-size:15px}
.box .link{color:#f85606;cursor:pointer;font-size:13px;margin-top:10px;display:block;text-align:center}
.close{float:right;cursor:pointer;font-size:20px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.item button{background:#eee;border:none;padding:3px 8px;cursor:pointer;border-radius:3px}
.total{font-weight:bold;margin:12px 0;font-size:16px}
.msg{color:red;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="reset()">daraz</div>
  <div class="search">
    <input id="q" placeholder="Search in Daraz" oninput="render()">
    <button onclick="render()">Search</button>
  </div>
  <div class="nav">
    <button id="userBtn" onclick="openModal('loginModal')">Login</button>
    <button onclick="openModal('cartModal');showCart()">🛒 Cart (<span id="cnt">0</span>)</button>
  </div>
</header>

<div class="banner">🔥 Mega Sale - Up to 70% OFF 🔥</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>

<!-- Login -->
<div class="modal" id="loginModal"><div class="box">
  <span class="close" onclick="closeModal('loginModal')">✖</span>
  <h2 id="authTitle">Login</h2>
  <input id="name" placeholder="Full Name" style="display:none">
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <div class="msg" id="authMsg"></div>
  <button class="btn" onclick="auth()" id="authBtn">Login</button>
  <span class="link" onclick="toggleAuth()" id="toggleTxt">Account nahi hai? Sign Up karein</span>
</div></div>

<!-- Cart -->
<div class="modal" id="cartModal"><div class="box">
  <span class="close" onclick="closeModal('cartModal')">✖</span>
  <h2>Shopping Cart</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="btn" onclick="checkout()">Checkout</button>
</div></div>

<!-- Checkout -->
<div class="modal" id="checkoutModal"><div class="box">
  <span class="close" onclick="closeModal('checkoutModal')">✖</span>
  <h2>Checkout</h2>
  <input id="addr" placeholder="Delivery Address">
  <input id="phone" placeholder="Phone Number">
  <p style="margin:8px 0;font-size:14px">Payment: Cash on Delivery</p>
  <div class="msg" id="coMsg"></div>
  <button class="btn" onclick="placeOrder()">Place Order</button>
</div></div>

<script>
const products=[
{id:1,name:"Wireless Earbuds",price:2499,old:3999,cat:"Electronics",e:"🎧"},
{id:2,name:"Smart Watch",price:4999,old:7999,cat:"Electronics",e:"⌚"},
{id:3,name:"Bluetooth Speaker",price:3200,old:4500,cat:"Electronics",e:"🔊"},
{id:4,name:"Mobile Phone",price:35999,old:42999,cat:"Electronics",e:"📱"},
{id:5,name:"Men's T-Shirt",price:999,old:1499,cat:"Fashion",e:"👕"},
{id:6,name:"Women's Dress",price:2199,old:3299,cat:"Fashion",e:"👗"},
{id:7,name:"Running Shoes",price:3499,old:4999,cat:"Fashion",e:"👟"},
{id:8,name:"Backpack",price:1799,old:2599,cat:"Fashion",e:"🎒"},
{id:9,name:"Blender",price:5200,old:6800,cat:"Home",e:"🍹"},
{id:10,name:"Table Lamp",price:1200,old:1800,cat:"Home",e:"💡"},
{id:11,name:"Cushion Set",price:1500,old:2200,cat:"Home",e:"🛋️"},
{id:12,name:"Face Cream",price:750,old:1100,cat:"Beauty",e:"🧴"},
{id:13,name:"Perfume",price:2800,old:3900,cat:"Beauty",e:"🌸"},
{id:14,name:"Story Book",price:600,old:900,cat:"Books",e:"📚"},
{id:15,name:"Football",price:1300,old:1900,cat:"Sports",e:"⚽"},
{id:16,name:"Cricket Bat",price:3900,old:5200,cat:"Sports",e:"🏏"}
];
const cats=["All",...new Set(products.map(p=>p.cat))];
let curCat="All",cart=JSON.parse(localStorage.getItem("cart")||"[]"),isSignup=false;
let user=JSON.parse(localStorage.getItem("currentUser")||"null");

function renderCats(){
  document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c===curCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){curCat=c;renderCats();render()}
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const list=products.filter(p=>(curCat==="All"||p.cat===curCat)&&p.name.toLowerCase().includes(q));
  document.getElementById("grid").innerHTML=list.length?list.map(p=>`
    <div class="card"><div class="emoji">${p.e}</div><h4>${p.name}</h4>
    <div class="price">Rs. ${p.price}</div><div class="old">Rs. ${p.old}</div>
    <button onclick="addCart(${p.id})">Add to Cart</button></div>`).join(""):"<p>No products found</p>";
}
function reset(){curCat="All";document.getElementById("q").value="";renderCats();render()}
function openModal(id){document.getElementById(id).classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function save(){localStorage.setItem("cart",JSON.stringify(cart));document.getElementById("cnt").innerText=cart.reduce((a,b)=>a+b.qty,0)}
function addCart(id){
  const it=cart.find(c=>c.id===id);
  if(it)it.qty++;else cart.push({id,qty:1});
  save();
}
function showCart(){
  let t=0;
  document.getElementById("cartItems").innerHTML=cart.length?cart.map(c=>{
    const p=products.find(x=>x.id===c.id);t+=p.price*c.qty;
    return `<div class="item"><span>${p.e} ${p.name} x${c.qty}</span><span>Rs. ${p.price*c.qty}
    <button onclick="chg(${c.id},1)">+</button><button onclick="chg(${c.id},-1)">-</button></span></div>`}).join(""):"<p>Cart khali hai</p>";
  document.getElementById("total").innerText="Total: Rs. "+t;
}
function chg(id,d){
  const it=cart.find(c=>c.id===id);it.qty+=d;
  if(it.qty<=0)cart=cart.filter(c=>c.id!==id);
  save();showCart();
}
function toggleAuth(){
  isSignup=!isSignup;
  document.getElementById("authTitle").innerText=isSignup?"Sign Up":"Login";
  document.getElementById("authBtn").innerText=isSignup?"Sign Up":"Login";
  document.getElementById("name").style.display=isSignup?"block":"none";
  document.getElementById("toggleTxt").innerText=isSignup?"Account hai? Login karein":"Account nahi hai? Sign Up karein";
  document.getElementById("authMsg").innerText="";
}
function auth(){
  const email=document.getElementById("email").value.trim();
  const pass=document.getElementById("pass").value;
  const name=document.getElementById("name").value.trim();
  const msg=document.getElementById("authMsg");
  let users=JSON.parse(localStorage.getItem("users")||"[]");
  if(!email||!pass){msg.innerText="Email aur password likhein";return}
  if(isSignup){
    if(!name){msg.innerText="Name likhein";return}
    if(users.find(u=>u.email===email)){msg.innerText="Email pehle se registered hai";return}
    users.push({name,email,pass});
    localStorage.setItem("users",JSON.stringify(users));
    toggleAuth();msg.style.color="green";msg.innerText="Account ban gaya! Ab login karein";
  }else{
    const u=users.find(u=>u.email===email&&u.pass===pass);
    if(!u){msg.style.color="red";msg.innerText="Galat email ya password";return}
    user=u;localStorage.setItem("currentUser",JSON.stringify(u));
    updateUser();closeModal("loginModal");
  }
}
function updateUser(){
  const b=document.getElementById("userBtn");
  if(user){b.innerText="👤 "+user.name+" (Logout)";b.onclick=logout}
  else{b.innerText="Login";b.onclick=()=>openModal("loginModal")}
}
function logout(){user=null;localStorage.removeItem("currentUser");updateUser()}
function checkout(){
  if(!user){closeModal("cartModal");openModal("loginModal");return}
  if(!cart.length){alert("Cart khali hai");return}
  closeModal("cartModal");openModal("checkoutModal");
}
function placeOrder(){
  const a=document.getElementById("addr").value.trim(),p=document.getElementById("phone").value.trim();
  if(!a||!p){document.getElementById("coMsg").innerText="Address aur phone likhein";return}
  cart=[];save();closeModal("checkoutModal");
  alert("✅ Order place ho gaya! Shukriya "+user.name);
}
renderCats();render();save();updateUser();
</script>
</body>
</html>
